name: Release

concurrency: release

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main

jobs:
  release:
    # Only run when CI was triggered by a push to main (i.e., merge)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Setup | Reset release branch to successful CI SHA
        run: |
          git reset --hard "${{ github.event.workflow_run.head_sha }}"

      - name: Semantic Release
        id: semrel
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ github.token }}
          changelog: false
          commit: false
          tag: true
          push: true
          vcs_release: true

      - name: Start publish workflow
        if: steps.semrel.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.semrel.outputs.tag }}
        run: gh workflow run publish.yml --ref main --field tag="$RELEASE_TAG"
